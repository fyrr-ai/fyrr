# Release: on a `v*` tag, runs ci.yml (`scripts/ci`) and, only if it
# passes, assembles the artifacts with scripts/release (both
# binaries, the connector SDK wheel, the contracts, both images and
# SHA256SUMS), uploads them to a draft, pushes both images to GHCR, then
# publishes the release. The tag must match the workspace version in Cargo.toml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  ci:
    # The documented local form; actionlint rejects the `$/` form.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: build release artifacts
    if: ${{ !github.event.repository.private }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [[ "$TAG" == "v$version" ]] || { echo "tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }

      - name: Free disk space for the Lance and image builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - name: Add swap for fat-LTO release links
        run: |
          sudo fallocate -l 12G /fyrr-swapfile
          sudo chmod 600 /fyrr-swapfile
          sudo mkswap /fyrr-swapfile >/dev/null
          sudo swapon /fyrr-swapfile

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the pinned cargo-deny (scripts/doctor requires it)
        run: |
          source scripts/pins.env
          cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"

      - name: Shared Cargo compilation cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: '1.30.0'
          backend: github

      - name: scripts/release
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release --version "${TAG#v}" --out dist

      - name: Check release binaries in supported runtime images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          dir="$PWD/dist/fyrr-$version"
          image_tag="$(awk '$1 == "image_tag" {print $2}' "$dir/manifest.txt")"
          for image in fyrr fyrr-reader; do
            docker run --rm --entrypoint /release-fyrr \
              --mount "type=bind,src=$dir/$image-$version-linux-x86_64,dst=/release-fyrr,readonly" \
              "$image:$image_tag" --version
          done
          providers="$(docker run --rm --entrypoint /release-fyrr \
            --mount "type=bind,src=$dir/fyrr-$version-linux-x86_64,dst=/release-fyrr,readonly" \
            "fyrr:$image_tag" writer providers)"
          printf '%s\n' "$providers"
          for provider in local-files google-drive notion github slack jira; do
            grep -qE "^${provider}[[:space:]].*[[:space:]]ok$" <<<"$providers"
          done

      - name: Upload the release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: publish verified artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist/

      - name: Publish the release and images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${TAG#v}"
          dir="dist/fyrr-$version"
          (cd "$dir" && sha256sum --check SHA256SUMS)
          diagnostic="$(mktemp)"
          trap 'rm -f "$diagnostic"' EXIT
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$diagnostic")" || {
            if ! grep -qx 'release not found' "$diagnostic"; then
              cat "$diagnostic" >&2
              exit 1
            fi
            draft=missing
          }
          [[ "$draft" == true || "$draft" == false || "$draft" == missing ]]
          if [[ "$draft" == false ]]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          if [[ "$draft" == missing ]]; then
            gh release create "$TAG" --draft --verify-tag --title "fyrr $version" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md). Verify downloads with \`sha256sum --check SHA256SUMS\`. The \`image_tag\` in \`manifest.txt\` identifies the checkout-owned tag loaded by each image archive."
          fi
          gh release upload "$TAG" --clobber "$dir"/*
          image_tag="$(awk '$1 == "image_tag" {print $2}' "$dir/manifest.txt")"
          [[ "$image_tag" =~ ^wt-[a-f0-9]{12}$ ]]
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io; rm -f "$diagnostic"' EXIT
          for image in fyrr fyrr-reader; do
            gunzip -c "$dir/$image-image-$version.tar.gz" | docker image load
            docker image tag "$image:$image_tag" "$registry/$image:$version"
            docker image push "$registry/$image:$version"
          done
          gh release edit "$TAG" --draft=false
