# One local/hosted entry point with declarative case tiers and shared builds.
# v* tags enter through release.yml's workflow_call, avoiding duplicate CI runs.
# No tier here compiles release binaries or builds images: release.yml's build
# job does both once, after this workflow passes.
name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!docs/**"
      - "!site/**"
      - "!**/*.md"
      - "!.github/ISSUE_TEMPLATE/**"
      # Quickstart and guide Markdown is test input.
      - "examples/quickstart/**"
      - "examples/guides/**"
      - "docs/guides/**"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!site/**"
      - "!**/*.md"
      - "!.github/ISSUE_TEMPLATE/**"
      - "examples/quickstart/**"
      - "examples/guides/**"
      - "docs/guides/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Key pull requests by number so a pull_request run, which cancels in
  # progress, can never share main's group and cancel main's runs.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Let main finish verification and save its caches during a burst of merges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  # mbx moves build-script OUT_DIRs to ~/.cache/mbx/out-dirs by default, but the
  # mbx action's target cache saves only target/ and the registry. Without this,
  # every restored crate that include!()s a generated file (serde_core, crunchy,
  # ...) is stale and the whole Arrow/DataFusion/Lance graph above it rebuilds.
  MBX_SHARE_OUT_DIR: "0"

jobs:
  ci:
    name: scripts/ci
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check whether the change only touches the quickstart or the guides
        id: scope
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$(git rev-parse --verify HEAD^1)" == "$BASE_SHA" ]] &&
             git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude,glob)examples/quickstart/**' \
               ':(exclude,glob)examples/guides/**' ':(exclude,glob)docs/guides/**'; then
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the verified base binary
        id: quickstart-binary
        if: steps.scope.outputs.base != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: fyrr-quickstart-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.scope.outputs.base }}
          path: target/ci-build/full/fyrr

      # External-service rows run real fixtures next to test processes; swap
      # keeps smaller runners from aborting on memory.
      - name: Add swap
        if: steps.quickstart-binary.outputs.cache-hit != 'true'
        run: |
          sudo fallocate -l 12G /fyrr-swapfile
          sudo chmod 600 /fyrr-swapfile
          sudo mkswap /fyrr-swapfile >/dev/null
          sudo swapon /fyrr-swapfile
          free -g

      - name: Install the pinned Rust toolchain
        if: steps.quickstart-binary.outputs.cache-hit != 'true'
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Read the mbx pin (mise.toml)
        id: mbx
        if: steps.quickstart-binary.outputs.cache-hit != 'true'
        run: echo "version=$(sed -n 's/^mr-boxington = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Shared Cargo compilation cache
        if: steps.quickstart-binary.outputs.cache-hit != 'true'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: ${{ steps.mbx.outputs.version }}
          backend: github
          save-on-workflow-dispatch: 'true'

      - name: scripts/ci
        env:
          FYRR_CI_REVISION: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_PRIVATE: ${{ github.event.repository.private }}
          CI_QUICKSTART_BINARY: ${{ steps.quickstart-binary.outputs.cache-hit }}
        run: |
          args=()
          # Tags run the full tier; everything else runs the quick tier.
          if [[ "$CI_REF" != refs/tags/v* ]]; then args+=(--quick); fi
          if [[ "$CI_PRIVATE" == true ]]; then args+=(--debug-only); fi
          if [[ "$CI_QUICKSTART_BINARY" == true ]]; then
            uv sync --locked --no-dev --project connectors
            python_lib="$(connectors/.venv/bin/python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
            export LD_LIBRARY_PATH="$python_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export FYRR_CI_PREBUILT=1
            args+=("--step=quickstart example (local storage)" "--step=guides (local storage)")
          fi
          mkdir -p target/ci-measurements
          /usr/bin/time -v -o target/ci-measurements/ci.time scripts/ci "${args[@]}"
          du -sh target | tee target/ci-measurements/size.txt
          if [[ "$CI_QUICKSTART_BINARY" != true ]]; then
            mbx stats > target/ci-measurements/cache.txt
          fi

      # A fresh checkout gives every workspace source a new mtime, so workspace
      # crates and test executables always rebuild. Drop them before the mbx
      # action saves target/; they are about 70% of its size. Dependencies are
      # kept. A unit belongs to the workspace when its dep-info lists a source
      # under crates/.
      - name: Drop workspace build products from the target cache
        if: ${{ !cancelled() && steps.quickstart-binary.outputs.cache-hit != 'true' }}
        run: |
          du -sh target/debug
          for depinfo in target/debug/deps/*.d; do
            grep -q "^crates/.*:\$" "$depinfo" || continue
            unit="$(basename "$depinfo" .d)"
            rm -f "target/debug/deps/$unit" "target/debug/deps/$unit".* "target/debug/deps/lib$unit".*
          done
          du -sh target/debug

      # Only successful main CI publishes a binary. A miss runs the usual suite.
      - name: Cache the verified binary for future quickstart changes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: fyrr-quickstart-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: target/ci-build/full/fyrr

      - name: Show the summary
        if: ${{ !cancelled() && hashFiles('target/ci-logs/*/summary.txt') != '' }}
        run: cat target/ci-logs/*/summary.txt

      - name: Upload the logs
        if: ${{ !cancelled() && hashFiles('target/ci-logs/*/ci.log', 'target/ci-measurements/*') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            target/ci-logs/
            target/ci-measurements/
          if-no-files-found: error
          retention-days: 7
