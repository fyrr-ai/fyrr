# One local/hosted entry point with declarative case tiers and shared builds.
# v* tags enter through release.yml's workflow_call, avoiding duplicate CI runs.
# No tier here compiles release binaries or builds images: release.yml's build
# job does both once, after this workflow passes.
name: ci

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "site/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  ci:
    name: scripts/ci
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Cargo builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE"

      # External-service rows run real fixtures next to test processes; swap
      # keeps smaller runners from aborting on memory.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /fyrr-swapfile
          sudo chmod 600 /fyrr-swapfile
          sudo mkswap /fyrr-swapfile >/dev/null
          sudo swapon /fyrr-swapfile
          free -g

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Shared Cargo compilation cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: '1.30.0'
          backend: github
          save-on-workflow-dispatch: 'true'

      - name: Install checksum-verified cargo-deny
        run: |
          source scripts/pins.env
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "$CARGO_DENY_URL"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum -c --quiet -
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/cargo-deny'
          install -m 755 "$RUNNER_TEMP/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      - name: scripts/ci
        env:
          FYRR_CI_REVISION: ${{ github.sha }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_PRIVATE: ${{ github.event.repository.private }}
        run: |
          args=()
          # Tags run the full tier; everything else runs the quick tier.
          if [[ "$CI_REF" != refs/tags/v* ]]; then args+=(--quick); fi
          if [[ "$CI_PRIVATE" == true ]]; then args+=(--debug-only); fi
          mkdir -p target/ci-measurements
          /usr/bin/time -v -o target/ci-measurements/ci.time scripts/ci "${args[@]}"
          du -sh target | tee target/ci-measurements/size.txt
          mbx stats > target/ci-measurements/cache.txt

      - name: Show the summary
        if: always()
        run: cat target/ci-logs/*/summary.txt

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            target/ci-logs/
            target/ci-measurements/
          if-no-files-found: error
          retention-days: 7

  # macOS is a development platform, built from source (docs/deployment.md):
  # this job shows whether the port still builds and whether units,
  # configuration, the CLI and local storage hold there. Everything else is
  # verified on Linux only. GitHub's free macOS capacity is unreliable, so the
  # job never blocks: it runs on pushes to main and by hand, not on pull
  # requests or releases, and its failure does not fail the workflow. Set the
  # repository variable CI_RUNNER_MACOS to use another macOS label.
  macos:
    name: scripts/ci subset on macOS
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    continue-on-error: true
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos-15' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts need Bash 4 and GNU utilities ahead of the system's.
      - name: Install Bash and GNU coreutils
        run: |
          brew install bash coreutils jq
          brew="$(brew --prefix)"
          echo "$brew/opt/coreutils/libexec/gnubin" >>"$GITHUB_PATH"
          echo "$brew/bin" >>"$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: scripts/doctor
        run: scripts/doctor --local

      - name: scripts/ci (units, configuration, CLI, local storage)
        env:
          FYRR_CI_REVISION: ${{ github.sha }}
        run: |
          scripts/ci --quick \
            "--step=unit tests" \
            "--step=configuration" \
            "--step=cli (full build)" \
            "--step=cli (reader-only build)" \
            "--step=local storage"

      - name: Show the summary
        if: always()
        run: cat target/ci-logs/*/summary.txt

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-macos-${{ github.sha }}
          path: target/ci-logs/
          if-no-files-found: warn
          retention-days: 7
