# Every job calls the same local entry point. Rust workers consume the exact
# build artifact; only build and lint compile the debug dependency graph.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: Run the PR gate instead of the full suite
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  FYRR_CI_REVISION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository]
        with:
          memory: 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: tests
      - name: Build and prove test ownership
        run: |
          mkdir -p target/ci-measurements
          /usr/bin/time -v -o target/ci-measurements/build.time scripts/ci --debug-only --group=build
          FYRR_CI_PREBUILT=1 scripts/ci-cases archive
          du -sh target/debug target/ci-build target/ci-tests.tar.zst | tee target/ci-measurements/size.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tests
          path: target/ci-tests.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: ./.github/actions/ci-logs # zizmor: ignore[self-repository]
        if: always()
        with:
          name: build

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository]
        with:
          memory: 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: clippy
      - run: scripts/ci --debug-only --group=lint
      - uses: ./.github/actions/ci-logs # zizmor: ignore[self-repository]
        if: always()
        with:
          name: lint

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository]
      - run: scripts/ci --debug-only --group=python
      - uses: ./.github/actions/ci-logs # zizmor: ignore[self-repository]
        if: always()
        with:
          name: python

  checks:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [core, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FYRR_CI_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-tests
          path: target
      - run: tar --zstd -xf target/ci-tests.tar.zst
      - name: Core tests or docs and quickstarts
        env:
          GROUP: ${{ matrix.group }}
          QUICK: ${{ (github.event_name == 'pull_request' || inputs.quick == true) && '--quick' || '--debug-only' }}
        run: scripts/ci "$QUICK" "--group=$GROUP"
      - uses: ./.github/actions/ci-logs # zizmor: ignore[self-repository]
        if: always()
        with:
          name: ${{ matrix.group }}

  s3:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'pull_request' || inputs.quick == true) && '[1]' || '[1,2,3,4,5,6]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FYRR_CI_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository]
        with:
          memory: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-tests
          path: target
      - run: tar --zstd -xf target/ci-tests.tar.zst
      - name: Real S3 rows on an independent fixture
        env:
          SHARD: ${{ matrix.shard }}
          QUICK: ${{ (github.event_name == 'pull_request' || inputs.quick == true) && 'true' || 'false' }}
        run: |
          if [[ "$QUICK" == true ]]; then
            scripts/ci --quick --group=s3
          else
            scripts/ci --debug-only "--shard=$SHARD/6"
          fi
      - uses: ./.github/actions/ci-logs # zizmor: ignore[self-repository]
        if: always()
        with:
          name: s3-${{ matrix.shard }}

  release-checks:
    if: >-
      !github.event.repository.private && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup # zizmor: ignore[self-repository]
        with:
          memory: 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
      - run: scripts/ci --images --group=release
      - uses: ./.github/actions/ci-logs # zizmor: ignore[self-repository]
        if: always()
        with:
          name: release
