# One complete local/hosted entry point. Compiler actions are shared through
# mr-boxington; bounded scenario concurrency and fixture ownership live in scripts/ci.
name: ci

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "site/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  ci:
    name: scripts/ci
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Cargo builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE"

      # External-service rows run real fixtures next to test processes; swap
      # keeps smaller runners from aborting on memory.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /fyrr-swapfile
          sudo chmod 600 /fyrr-swapfile
          sudo mkswap /fyrr-swapfile >/dev/null
          sudo swapon /fyrr-swapfile
          free -g

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Shared Cargo compilation cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: '1.30.0'
          backend: github
          save-on-workflow-dispatch: 'true'

      - name: Install checksum-verified cargo-deny
        run: |
          source scripts/pins.env
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "$CARGO_DENY_URL"
          echo "$CARGO_DENY_SHA256  $archive" | sha256sum -c --quiet -
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/cargo-deny'
          install -m 755 "$RUNNER_TEMP/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      - name: scripts/ci
        env:
          FYRR_CI_REVISION: ${{ github.sha }}
        run: |
          mkdir -p target/ci-measurements
          /usr/bin/time -v -o target/ci-measurements/ci.time scripts/ci
          du -sh target | tee target/ci-measurements/size.txt
          mbx stats > target/ci-measurements/cache.txt

      - name: Show the summary
        if: always()
        run: cat target/ci-logs/*/summary.txt

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.sha }}
          path: |
            target/ci-logs/
            target/images/*.log
            target/images/*.txt
            target/ci-measurements/
          if-no-files-found: error
          retention-days: 7
