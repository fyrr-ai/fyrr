name: CI logs
description: Show per-step counts and retain diagnostics even after failure
inputs:
  name:
    description: Unique artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Show summaries
      shell: bash
      run: |
        shopt -s nullglob
        for summary in target/ci-logs/*/summary.txt; do cat "$summary"; done
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-logs-${{ inputs.name }}
        path: |
          target/ci-logs/
          target/images/*.log
          target/images/*.txt
          target/ci-measurements/
        if-no-files-found: error
        retention-days: 7
