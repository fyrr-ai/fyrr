[project]
name = "fyrr-provider-markdown"
version = "0.1.0"
description = "Example fyrr connector provider: Markdown files in a local directory"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The SDK series (0.1) is the compatibility promise; 0.1.0 and 0.1.1 were built
# for the embedded interpreter and do not work with this fyrr.
dependencies = ["fyrr-connectors>=0.1.2,<0.2"]

[project.entry-points."fyrr.connectors"]
markdown-dir = "fyrr_provider_markdown:provider_info"

[dependency-groups]
dev = ["fyrr-connectors[testkit]", "pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["uv_build>=0.12.21,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

# Development only: the SDK from this repository. The wheel's metadata keeps
# the plain requirement above.
[tool.uv.sources]
fyrr-connectors = { path = "../../connectors" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
