apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reader
spec:
  replicas: {{ .Values.reader.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fyrr-reader
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fyrr-reader
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
    spec:
      {{- include "fyrr.podSecurity" . | nindent 6 }}
      {{- with .Values.reader.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: reader
          image: {{ .Values.reader.image.repository }}:{{ .Values.reader.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/fyrr/fyrr.toml", "reader", "serve"]
          {{- include "fyrr.containerSecurity" . | nindent 10 }}
          env:
            # The default mirror is $XDG_CACHE_HOME/fyrr/<namespace>.
            - name: XDG_CACHE_HOME
              value: /cache
            {{- with .Values.reader.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.reader.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.reader.port }}
            {{- with .Values.metrics.port }}
            - name: metrics
              containerPort: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- with .Values.reader.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/fyrr
              readOnly: true
            - name: mirror
              mountPath: /cache
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: mirror
          emptyDir:
            sizeLimit: {{ .Values.reader.mirrorSizeLimit }}
---
# ClusterIP only: the reader refuses requests with an Origin header and
# speaks plain HTTP, so put a TLS-terminating gateway in front of it.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-reader
spec:
  selector:
    app.kubernetes.io/name: fyrr-reader
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.reader.port }}
      targetPort: http
