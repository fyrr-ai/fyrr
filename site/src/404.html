<style>
/*BASE*/
  .lost { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 96px var(--gutter) 64px; max-width: 1120px; margin: 0 auto; }
  .lost .eyebrow { margin-bottom: 20px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--yellow); }
  .lost h1 { font-size: clamp(36px, 5vw, 64px); line-height: 1.04; font-weight: 400; letter-spacing: -.05em; }
  .lost p { max-width: 46ch; margin-top: 20px; font-size: 18px; line-height: 27px; color: var(--fg-muted); }
  .lost__sea { display: block; width: 100vw; margin-left: calc(50% - 50vw); height: 72px; margin-bottom: 40px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .lost a.btn { display: inline-block; margin-top: 32px; padding: 12px 16px; background: var(--yellow); color: #000; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
</style>

<body>
<!--HEADER-->
<main class="lost">
  <canvas class="lost__sea" id="sea" aria-hidden="true"></canvas>
  <p class="eyebrow">404</p>
  <h1>Lost at sea.</h1>
  <p>There is no island at this address. The chart starts at the harbour.</p>
  <p><a class="btn" href="/">Back to the harbour</a> &nbsp; <a href="/docs/quickstart.html">Docs</a></p>
</main>
<script>
/* One ship that starts above the "404" and sails back and forth across the screen, turning at
   each edge so it never leaves; a fading wake follows it. 2 CSS px per pixel, 15 fps. */
(function () {
  var c = document.getElementById('sea'), ctx = c.getContext('2d'), mark = document.querySelector('.lost .eyebrow');
  var SHIP = ['..........#....', '....#.....##...', '....##....###..', '....###...####.', '....####..#####', '....#####.#....', '....#.....#....', '..#############', '...###########.', '....#########..'];
  var x = null, dir = 1, wake = [], last = 0, lastWake = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden || now - last < 66) return;
    var dt = last ? Math.min(0.2, (now - last) / 1000) : 0, t = now / 1000; last = now;
    var w = Math.round(c.clientWidth / 2), h = Math.round(c.clientHeight / 2);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    if (x === null) x = Math.round((mark.getBoundingClientRect().left - c.getBoundingClientRect().left) / 2) + 7;
    x += dir * 9 * dt;
    if (x > w - 9) { x = w - 9; dir = -1; }
    if (x < 9) { x = 9; dir = 1; }
    var y = Math.round(h / 2 + 2 + Math.sin(t * 1.6));
    if (t - lastWake > 0.4) { wake.push([x - dir * 8, y + 4, t]); lastWake = t; if (wake.length > 40) wake.shift(); }
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#5c5c5c';
    wake.forEach(function (k) { if (t - k[2] < 12) ctx.fillRect(Math.round(k[0]), k[1], 1, 1); });
    ctx.fillStyle = '#ffea5d';
    var x0 = Math.round(x - 7), flip = dir < 0;
    for (var r = 0; r < SHIP.length; r++) for (var q = 0; q < 15; q++) if (SHIP[r][q] === '#') ctx.fillRect(x0 + (flip ? 14 - q : q), y - 9 + r, 1, 1);
  }
  requestAnimationFrame(frame);
})();
</script>
